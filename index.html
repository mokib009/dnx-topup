<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DNX Topup Store</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <h1>💜 DNX Topup Store</h1>
    <p>Free Fire Diamonds • Fast • Safe</p>
  </header>

  <main>
    <section id="uidBox">
      <label for="uid">Enter Free Fire UID</label><br/>
      <input id="uid" inputmode="numeric" placeholder="Example: 123456789" />
      <button id="checkBtn">Check IGN</button>
      <p id="ignOutput"></p>
    </section>

    <section id="packs">
      <h2>Choose a Pack</h2>
      <div class="pack" onclick="buy('100 Diamonds','₹50')">100 Diamonds — ₹50</div>
      <div class="pack" onclick="buy('310 Diamonds','₹140')">310 Diamonds — ₹140</div>
      <div class="pack" onclick="buy('560 Diamonds','₹250')">560 Diamonds — ₹250</div>
    </section>

    <section id="payment" hidden>
      <h2>Payment Instructions</h2>
      <p>Send the requested amount to UPI ID: <strong id="upi">Q009237318@ybl</strong></p>
      <p>After payment, take screenshot and send it to our Telegram Bot to confirm.</p>
      <button id="doneBtn">I paid — Send order</button>
    </section>
  </main>

  <footer>
    <p>© DNX Topup Store</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
